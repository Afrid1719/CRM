services:
    nginx-proxy:
        image: nginxproxy/nginx-proxy
        container_name: nginx-proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./docker/certs:/etc/nginx/certs
        networks:
            - crm-net

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: crm-phpmyadmin
        environment:
            - PMA_HOST=crm-mysql
            - VIRTUAL_HOST=db.crm.localhost
            - VIRTUAL_PORT=80
        depends_on:
            - mysql
        networks:
            - crm-net

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: crm-app
        expose:
            - "8000"
        environment:
            - VIRTUAL_HOST=crm.localhost
            - VIRTUAL_PORT=8000
        volumes:
            - .:/var/www/html
        networks:
            - crm-net
        depends_on:
            - mysql

    mysql:
        image: mysql:8
        container_name: crm-mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: crm
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - crm-net

volumes:
    mysql-data:

networks:
    crm-net:
