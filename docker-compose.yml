services:
    nginx-proxy:
        image: nginxproxy/nginx-proxy
        container_name: nginx-proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            - ./certs:/etc/nginx/certs:ro
        networks:
            - crm-net

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: crm-phpmyadmin
        environment:
            - PMA_HOST=crm-mysql
            - VIRTUAL_HOST=db.crm.localhost
            - VIRTUAL_PORT=80
        depends_on:
            - mysql
        networks:
            - crm-net

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: crm-app
        expose:
            - "8000"
        ports:
            - "5173:5173" # Vite dev server
        environment:
            - VIRTUAL_HOST=crm.localhost,crm.vite.localhost
            - VIRTUAL_PORT=8000
            - APP_ENV=local
            - VITE_DEV_SERVER=true
        volumes:
            - .:/var/www/html
            - ./certs:/etc/nginx/certs:ro
        networks:
            - crm-net
        depends_on:
            - mysql
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    mysql:
        image: mysql:8
        container_name: crm-mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: crm
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - crm-net

volumes:
    mysql-data:

networks:
    crm-net:
